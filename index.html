<!-- templates/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Emotion Detector</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
  <div class="container">
    <header>
      <h1>Emotion Detector</h1>
      <small>Faceless — keyword based • No ML</small>
    </header>

    <main class="grid">
      <section class="left">
        <label for="inputText">Enter text or paste a paragraph</label>
        <textarea id="inputText" placeholder="Type or paste text...">I am so excited for my birthday. But a little nervous. Thanks for the lovely gifts.</textarea>
        <div class="controls">
          <button id="detectBtn" class="primary">Detect Emotion</button>
          <button id="exportBtn" class="secondary">Export Summary (TXT)</button>
          <button id="shareBtn" class="secondary">Share Result</button>
        </div>
        


        <div id="sentenceAnalysis" class="card">
          <h3>Sentence-wise Analysis</h3>
          <div id="sentencesList"></div>
        </div>
      </section>

      <aside class="right card">
        <h3>Detected Emotions</h3>
        <div id="aggregateBars"></div>
        <div class="auto-reply">
          <h4>Auto-reply:</h4>
          <p id="autoReply">—</p>
        </div>
      </aside>
    </main>

    <footer>
      <small>Preview mockup — Keyword based detector. Backend & frontend included.</small>
    </footer>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
